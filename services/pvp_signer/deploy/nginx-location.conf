# Include inside an existing HTTPS server block; /pvp/ is an example base URL.
# Do not expose port 8430. This proxy replaces the IP header (not X-Forwarded-For).
location /pvp/ {
    client_max_body_size 16k;
    client_body_timeout 10s;
    proxy_request_buffering on;
    proxy_connect_timeout 2s;
    proxy_read_timeout 12s;
    proxy_send_timeout 12s;
    proxy_http_version 1.1;
    proxy_set_header Connection close;
    proxy_set_header Host $host;
    proxy_set_header X-Pvp-Client-IP $remote_addr;
    proxy_pass http://127.0.0.1:8430/;
    access_log off;
}
