[preset.0]
name="Windows"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="*.json,*.bin,*.sha256,*.md,*.txt,*.ico,*.icns"
exclude_filter="build/*,docs/*,art_sources/*,tests/*,tools/*,services/*,addons/*,.git/*"
export_path="build/Windows/SolarisBrawl.exe"
script_export_mode=0

[preset.0.options]
application/modify_resources=true
application/icon="res://assets/ui/branding/app-icon.ico"
application/product_name="索拉里斯大乱斗"
application/file_description="索拉里斯大乱斗"

[preset.1]
name="macOS"
platform="macOS"
runnable=true
export_filter="all_resources"
include_filter="*.json,*.bin,*.sha256,*.md,*.txt,*.ico,*.icns"
exclude_filter="build/*,docs/*,art_sources/*,tests/*,tools/*,services/*,addons/*,.git/*"
export_path="build/macOS/SolarisBrawl.zip"
script_export_mode=0

[preset.1.options]
application/bundle_identifier="game.solarisbrawl.demo"
application/icon="res://assets/ui/branding/app-icon.icns"

[preset.2]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="*.json,*.bin,*.sha256,*.md,*.txt,*.ico,*.icns"
exclude_filter="build/*,docs/*,art_sources/*,tests/*,tools/*,services/*,addons/*,.git/*"
export_path="build/Web/SolarisBrawl.html"
script_export_mode=0

[preset.2.options]
variant/thread_support=false
html/export_icon=true

